<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195" role="img" aria-labelledby="title desc">
  <title id="title">GitHub stats placeholder</title>
  <desc id="desc">Placeholder card until GitHub Actions generates the stats card.</desc>
  <rect width="495" height="195" rx="12" fill="#0d1117" />
  <rect x="1" y="1" width="493" height="193" rx="11" fill="none" stroke="#30363d" />
  <text x="24" y="42" fill="#f0f6fc" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700">GitHub Stats</text>
  <text x="24" y="78" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">This card is generated by GitHub Actions.</text>
  <text x="24" y="104" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">Push this commit, then run the workflow once</text>
  <text x="24" y="126" fill="#8b949e" font-family="Segoe UI, Arial, sans-serif" font-size="15">to replace this placeholder with live stats.</text>
</svg>
